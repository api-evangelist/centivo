aid: centivo
name: Centivo
description: 'Centivo is a primary-care-centered health plan administrator for self-funded
  employers, founded in 2017 and headquartered in New York City. Sold through benefits
  brokers and consultants, it serves mid-market employers (roughly 50 or more employees)
  and covers about 77,000 members across 160 businesses. Members get $0 primary care
  to encourage early intervention, and employers typically save 15-30% versus traditional
  fully-insured plans through a primary-care-first model, the cost advantages of self-funding,
  and directly negotiated health-system partnerships. Centivo operates member, employer,
  provider, and referral portals plus iOS/Android member apps; it does not publish
  a public developer API. Backed by Bain Capital Ventures and JPMorgan Chase''s Morgan
  Health.'
